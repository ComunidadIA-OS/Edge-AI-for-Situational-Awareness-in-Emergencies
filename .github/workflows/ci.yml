name: CI

on:
  push:
    branches: [v0.1-EdgeDevice]
  pull_request:
    branches: [v0.1-EdgeDevice]

permissions:
  contents: read

jobs:
  test:
    name: edge + convergence (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy<2 ships manylinux wheels for cp310-cp312; the vision suite
        # (torch / TensorRT / OpenCV) needs CUDA hardware and is not run here.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (slim deps — no torch / CUDA / OpenCV)
        run: python -m pip install -e ".[dev]"

      - name: Run pure-Python suite (Balbi physics + edge orchestration)
        run: python -m pytest tests/edge tests/convergence -q
