name: CI

on:
  push:
    branches: [v0.1-GroundControl]
  pull_request:
    branches: [v0.1-GroundControl]

jobs:
  ground-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ground-control

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ground-control/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: ground-control
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ground-control
          push: false
          tags: heimdall-ground-control:ci
