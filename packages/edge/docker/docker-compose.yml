# Heimdall edge — full stack (convergence API + vision inference)
#
# Quick start (from project root):
#   cp docker/.env.example docker/.env   # adjust if needed
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
#
# The convergence-api container handles weather + fire physics (FastAPI :8000).
# The vision-inference container runs TensorRT inference on the thermal camera
# and pipes detections into the API; the edge supervisor manages camera checks,
# API health monitoring, and audible alerts via the GPIO buzzer.

services:

  # ─── Convergence API ────────────────────────────────────────────────────────
  convergence-api:
    image: xheimdall-convergence:jetson
    container_name: xheimdall-convergence-api
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - heimdall

  # ─── Vision Inference ───────────────────────────────────────────────────────
  vision-inference:
    image: xheimdall-vision:jetson
    container_name: xheimdall-vision-inference
    build:
      context: ..
      dockerfile: docker/Dockerfile.vision
    restart: unless-stopped
    # Requires NVIDIA container runtime: sudo apt install nvidia-container-toolkit
    runtime: nvidia
    # privileged grants access to /dev/video* and /dev/gpiochip* for buzzer
    privileged: true
    depends_on:
      convergence-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CONVERGENCE_API_URL: "http://convergence-api:8000"
      PYTHONPATH: "/app"
    volumes:
      # Read-write so the entrypoint can write best.engine after the first
      # TensorRT export. Pre-place best.pt here to skip the GitHub download.
      - ../models:/models
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}"
      # Uncomment to expose GPIO chip for buzzer (requires removing privileged: true):
      # - /dev/gpiochip0:/dev/gpiochip0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - heimdall

networks:
  heimdall:
    driver: bridge
