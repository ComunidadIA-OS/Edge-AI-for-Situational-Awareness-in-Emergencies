# =============================================================================
# Heimdall — Ground Control · docker-compose
# -----------------------------------------------------------------------------
# One command to build + run the dashboard, no Node.js required on the host.
#
#   docker compose up --build
#   # open http://localhost:3000
#
# To stop:  docker compose down
# =============================================================================
services:
  ground-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: heimdall-ground-control:latest
    container_name: heimdall-ground-control
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
